name: Deploy a S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requerido por la autenticación OIDC contra AWS.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y publicación
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.url.outputs.site }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Credenciales AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Primero los assets con hash: quedan disponibles antes de que el nuevo
      # index.html los referencie. Al revés, hay una ventana de 404.
      - name: Subir assets (caché inmutable)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Subir index.html (sin caché)
        run: |
          aws s3 cp dist/index.html "s3://${{ secrets.AWS_S3_BUCKET }}/index.html" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidar CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidación $ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      - name: URL del sitio
        id: url
        run: |
          DOMAIN=$(aws cloudfront get-distribution \
            --id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --query 'Distribution.DomainName' --output text)
          echo "site=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Publicado en https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
